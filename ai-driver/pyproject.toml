[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "squash-ai-driver"
version = "0.1.0"
description = "Minimal OpenAI diagnostic driver for Squash RMM"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  "streamlit>=1.57,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
squash-diagnose = "squash_ai_driver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/squash_ai_driver"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"


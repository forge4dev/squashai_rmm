[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "squash-control-plane"
version = "0.1.0"
description = "Squash AI-native RMM control plane"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
squash-control-plane = "squash_control_plane.runner:main"
squash-control-plane-service = "squash_control_plane.windows_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/squash_control_plane"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

